# Postgres + 6 identical APIs. Backends live in the "app" profile so only one runs at a time:
#   docker compose up -d postgres && docker compose up -d --build go
x-backend: &backend
  profiles: ["app"]
  depends_on:
    postgres: { condition: service_healthy }
  environment:
    DATABASE_URL: postgres://bench:bench@postgres:5432/bench
    POOL_SIZE: "20"       # total connections per backend (2-worker runtimes split it 10 + 10)
  cpus: 2
  mem_limit: 1g
  memswap_limit: 1g

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench_template
    command: >
      postgres -c max_connections=200 -c shared_buffers=512MB -c effective_cache_size=1536MB
               -c work_mem=8MB -c maintenance_work_mem=256MB -c random_page_cost=1.1
               -c max_parallel_workers_per_gather=0 -c jit=off
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/03-clone.sh:/docker-entrypoint-initdb.d/03-clone.sh:ro
    ports: ["5432:5432"]
    cpus: 4
    mem_limit: 2g
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "psql -U bench -d bench -c 'select 1' >/dev/null"]
      interval: 2s
      retries: 60

  go:     { <<: *backend, build: ./backends/go,     ports: ["8081:8080"] }
  rust:   { <<: *backend, build: ./backends/rust,   ports: ["8082:8080"] }
  dotnet: { <<: *backend, build: ./backends/dotnet, ports: ["8083:8080"] }
  node:   { <<: *backend, build: ./backends/node,   ports: ["8084:8080"] }
  python: { <<: *backend, build: ./backends/python, ports: ["8085:8080"] }
  cpp:    { <<: *backend, build: ./backends/cpp,    ports: ["8086:8080"] }

  # One-off tools, run with `docker compose run --rm <name>`.
  k6:
    profiles: ["tools"]
    image: grafana/k6:0.54.0
    volumes: ["./bench/k6:/scripts:ro", "./results:/results"]
  tools:
    profiles: ["tools"]
    build: ./report
    volumes: [".:/work"]
    working_dir: /work
